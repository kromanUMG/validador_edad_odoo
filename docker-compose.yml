version: '3.1'

services:
  db:
    image: postgres:14
    container_name: odoo-db
    environment:
      - POSTGRES_DB=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    ports:
      - "5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:16.0
    container_name: odoo-app
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo-web-data:/var/lib/odoo
    #descomentar la primera vez que ejecuta docker-compose up -d
    #command: odoo -d odoo -i base --without-demo=all --stop-after-init


volumes:
  odoo-db-data:
  odoo-web-data:


